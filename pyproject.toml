[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "casperac"
version = "0.1.0"
description = "Advanced dual-layer network anonymization wrapper."
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "Cagri", email = "cagritas@users.noreply.github.com" }
]
keywords = ["proxy", "anonymity", "tor", "warp", "cli", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Internet :: Proxy Servers"
]
dependencies = [
    "typer[all]>=0.9.0",
    "rich>=13.0.0",
    "requests[socks]>=2.31.0"
]

[project.urls]
Homepage = "https://github.com/cagritas/casperac"
Repository = "https://github.com/cagritas/casperac.git"
"Bug Tracker" = "https://github.com/cagritas/casperac/issues"

[project.scripts]
casperac = "casperac.main:app"
