[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "casperac"
version = "0.1.0"
description = "A dual-layer network anonymization wrapper."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "typer[all]>=0.9.0",
    "rich>=13.0.0",
    "requests[socks]>=2.31.0"
]

[project.scripts]
casperac = "casperac.main:app"
